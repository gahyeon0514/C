<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비주얼 노벨 프레임워크 (Visual Novel Engine)</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter & Nanum Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            user-select: none;
        }
        /* 대사창 페이드인 등 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen w-screen overflow-hidden flex flex-col justify-center items-center">

    <!-- 전체 앱 컨테이너 -->
    <div id="app" class="relative w-full max-w-5xl h-[700px] bg-black shadow-2xl overflow-hidden flex flex-col border border-gray-800 rounded-xl">

        <!-- 1. 로그인 화면 (Login Screen) -->
        <div id="login-screen" class="absolute inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center p-6">
            <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-700 text-center">
                <h1 class="text-2xl font-bold mb-2 text-indigo-400">비주얼 노벨 시스템</h1>
                <p class="text-sm text-gray-400 mb-6">플레이어 계정을 입력하여 진행 상황을 분리하여 저장하세요.</p>
                <input type="text" id="username-input" placeholder="플레이어 닉네임 또는 ID 입력" class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg mb-4 text-white focus:outline-none focus:border-indigo-500">
                <button onclick="handleLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition shadow-lg">게임 시작 / 이어하기</button>
            </div>
        </div>

        <!-- 2. 메인 타이틀 화면 (Title Screen) -->
        <div id="title-screen" class="absolute inset-0 bg-cover bg-center z-40 flex flex-col justify-between p-12 bg-gray-900 hidden" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://placehold.co/1200x800/111827/4b5563?text=Café+Background');">
            <div class="mt-12">
                <span id="current-user-badge" class="px-3 py-1 bg-indigo-900 text-indigo-200 text-xs rounded-full font-semibold">계정: 없음</span>
                <h1 id="game-title" class="text-5xl font-extrabold text-white mt-4 tracking-wider drop-shadow-md">카페: 신의 휴식처</h1>
                <p id="game-subtitle" class="text-gray-300 mt-2 text-lg">데이터 주도형 비주얼 노벨 프레임워크</p>
            </div>
            <div class="flex flex-col gap-3 w-64 mb-12">
                <button onclick="startGame()" class="py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg transition text-left px-6">처음부터 시작</button>
                <button onclick="openLoadModal()" class="py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-lg shadow-lg transition text-left px-6">이어하기 / 불러오기</button>
                <button onclick="openEndingGallery()" class="py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-lg shadow-lg transition text-left px-6">엔딩 갤러리</button>
                <button onclick="openSettingsModal()" class="py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-lg shadow-lg transition text-left px-6">설정</button>
            </div>
        </div>

        <!-- 3. 게임 플레이 화면 (Game Play Screen) -->
        <div id="game-screen" class="absolute inset-0 flex flex-col justify-between hidden bg-cover bg-center transition-all duration-500" style="background-image: url('https://placehold.co/1200x800/1a202c/4a5568?text=Background');">
            
            <!-- 상단 메뉴 및 에피소드 정보 바 -->
            <div class="flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent z-20">
                <div>
                    <span id="ui-episode-name" class="text-xs bg-indigo-600 px-2.5 py-1 rounded-md text-white font-bold uppercase tracking-wider">프롤로그</span>
                    <span id="ui-scene-id" class="text-xs text-gray-400 ml-2">scene_01</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleAutoPlay()" id="auto-btn" class="px-3 py-1.5 bg-black/50 hover:bg-black/70 text-xs rounded-lg border border-white/20 transition">자동: 꺼짐</button>
                    <button onclick="openSaveModal()" class="px-3 py-1.5 bg-black/50 hover:bg-black/70 text-xs rounded-lg border border-white/20 transition">저장</button>
                    <button onclick="openLoadModal()" class="px-3 py-1.5 bg-black/50 hover:bg-black/70 text-xs rounded-lg border border-white/20 transition">불러오기</button>
                    <button onclick="openLogModal()" class="px-3 py-1.5 bg-black/50 hover:bg-black/70 text-xs rounded-lg border border-white/20 transition">로그</button>
                    <button onclick="openSettingsModal()" class="px-3 py-1.5 bg-black/50 hover:bg-black/70 text-xs rounded-lg border border-white/20 transition">설정</button>
                    <button onclick="returnToTitle()" class="px-3 py-1.5 bg-red-900/60 hover:bg-red-800 text-xs rounded-lg border border-red-500/30 transition">메인으로</button>
                </div>
            </div>

            <!-- 중앙 캐릭터 영역 -->
            <div class="relative flex-1 flex justify-center items-end px-12 pb-4 overflow-hidden pointer-events-none z-10">
                <div id="character-container" class="flex justify-center items-end gap-8 w-full h-full">
                    <!-- 캐릭터 동적 삽입 위치 -->
                </div>
            </div>

            <!-- 선택지 영역 -->
            <div id="choices-container" class="absolute inset-0 bg-black/60 z-30 flex flex-col items-center justify-center gap-4 p-8 hidden">
                <!-- 선택지 버튼 동적 삽입 위치 -->
            </div>

            <!-- 하단 대사창 영역 -->
            <div class="relative z-25 p-6 bg-gradient-to-t from-black via-black/90 to-transparent pt-16">
                <div onclick="handleNextClick()" class="max-w-4xl mx-auto bg-gray-900/90 border border-gray-700 rounded-xl p-6 shadow-2xl cursor-pointer min-h-[140px] flex flex-col justify-between backdrop-blur-sm relative">
                    <!-- 화자 이름표 -->
                    <div class="absolute -top-4 left-6 bg-indigo-600 text-white px-4 py-1 rounded-md text-sm font-bold shadow-md" id="speaker-name">
                        화자 이름
                    </div>
                    <!-- 대사 텍스트 -->
                    <div class="text-gray-100 text-lg leading-relaxed mt-2" id="dialogue-text">
                        여기에 대사가 출력됩니다. 다음 대사 버튼을 누르거나 화면을 클릭하세요.
                    </div>
                    <!-- 클릭 안내 인디케이터 -->
                    <div class="flex justify-end items-center mt-2 text-xs text-gray-400">
                        <span class="animate-pulse">▼ 클릭하여 계속</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. 모달창 시스템 (저장/불러오기/로그/설정/엔딩갤러리) -->
        <div id="modal-overlay" class="absolute inset-0 bg-black/80 z-50 flex items-center justify-center p-6 hidden">
            <!-- 모달 내부 컨텐츠는 JS로 동적 렌더링 -->
            <div id="modal-content" class="bg-gray-900 border border-gray-700 w-full max-w-2xl rounded-xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
                <!-- 동적 폼 -->
            </div>
        </div>

        <!-- 알림 메시지 박스 -->
        <div id="message-box" class="absolute top-6 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white px-6 py-3 rounded-lg shadow-2xl z-60 transition-all duration-300 opacity-0 pointer-events-none">
            알림 메시지입니다.
        </div>

    </div>

    <script>
        /* ==========================================================================
           [콘텐츠 데이터 관리 영역] 
           사용자는 아래의 데이터를 직접 수정, 추가, 확장할 수 있습니다.
           시스템 코드를 건드리지 않고 아래 설정들만 조작하면 됩니다.
           ========================================================================== */

        // 1. 에피소드 정의
        const EPISODES = {
            "prologue": { id: "prologue", name: "프롤로그: 구인 전단지", startScene: "scene_01" },
            "episode_1": { id: "episode_1", name: "에피소드 1: 첫 번째 손님", startScene: "scene_100" }
        };

        // 2. 배경 이미지 정의 (경로 또는 파일명 직접 수정 가능)
        const BACKGROUNDS = {
            "street_day": "https://placehold.co/1200x800/2d3748/a0aec0?text=Street+-+Day",
            "cafe_interior": "https://placehold.co/1200x800/1a202c/cbd5e0?text=Cafe+Interior",
            "cafe_night": "https://placehold.co/1200x800/0f172a/94a3b8?text=Cafe+-+Night"
        };

        // 3. 캐릭터 정의 (이름, 이미지, 표정 목록, 크기 등 설정)
        const CHARACTERS = {
            "protagonist": {
                name: "주인공",
                expressions: {
                    default: "https://placehold.co/300x600/3b82f6/ffffff?text=Protagonist",
                    surprised: "https://placehold.co/300x600/2563eb/ffffff?text=Protagonist+(Surprised)"
                },
                position: "left"
            },
            "god_cafe_owner": {
                name: "카페 주인 (신)",
                expressions: {
                    default: "https://placehold.co/300x600/8b5cf6/ffffff?text=God+Owner",
                    smile: "https://placehold.co/300x600/7c3aed/ffffff?text=God+Owner+(Smile)"
                },
                position: "right"
            },
            "customer_1": {
                name: "지친 방랑자",
                expressions: {
                    default: "https://placehold.co/300x600/ef4444/ffffff?text=Customer",
                    sad: "https://placehold.co/300x600/dc2626/ffffff?text=Customer+(Sad)"
                },
                position: "right"
            }
        };

        // 4. 스토리 장면(Scene) 및 대화 데이터 
        // 각 장면은 고유 ID를 가 가지며, 대사 배열(dialogues)과 선택지(choices)를 포함합니다.
        const SCENES = {
            "scene_01": {
                episode: "prologue",
                background: "street_day",
                dialogues: [
                    { speaker: "protagonist", expression: "default", text: "구인 전단지에는 적혀 있었다. '모든 고민을 해결해주는 작은 카페, 직원 급구.'" },
                    { speaker: "protagonist", expression: "default", text: "설마 신이 직접 운영하는 카페일 줄이야. 호기심 반, 의심 반으로 문을 열었다." }
                ],
                nextScene: "scene_02"
            },
            "scene_02": {
                episode: "prologue",
                background: "cafe_interior",
                dialogues: [
                    { speaker: "god_cafe_owner", expression: "default", text: "어서 오게. 면접 보러 온 친구인가?" },
                    { speaker: "god_cafe_owner", expression: "smile", text: "이곳에서는 세상의 아픔과 결핍을 마주하게 될 걸네. 자, 어떻게 하겠나?" }
                ],
                // 선택지 정의 (선택시 특정 장면 ID로 이동)
                choices: [
                    { text: "직원으로 일하겠습니다.", nextScene: "scene_hire_yes" },
                    { text: "정체가 뭡니까? 돌아가겠습니다.", nextScene: "scene_hire_no" }
                ]
            },
            "scene_hire_yes": {
                episode: "prologue",
                background: "cafe_interior",
                dialogues: [
                    { speaker: "god_cafe_owner", expression: "smile", text: "훌륭한 대답이야. 오늘부터 너는 이 카페의 직원이다." },
                    { speaker: "protagonist", expression: "surprised", text: "이렇게 쉽게 채용되다니... 앞으로 어떤 일이 벌어질까?" }
                ],
                nextScene: "scene_prologue_end"
            },
            "scene_hire_no": {
                episode: "prologue",
                background: "street_day",
                dialogues: [
                    { speaker: "protagonist", expression: "default", text: "너무 수상하다. 나는 뒤돌아 카페를 나왔다." }
                ],
                nextScene: "ending_coward"
            },
            "scene_prologue_end": {
                episode: "prologue",
                background: "cafe_interior",
                dialogues: [
                    { speaker: "god_cafe_owner", expression: "default", text: "자, 프롤로그가 끝났네. 이제 첫 번째 손님이 찾아올 시간이야." }
                ],
                nextScene: "scene_100"
            },
            // 에피소드 1 영역
            "scene_100": {
                episode: "episode_1",
                background: "cafe_night",
                dialogues: [
                    { speaker: "customer_1", expression: "sad", text: "실례합니다... 문 열었나요? 마음이 너무 허전해서 찾아왔습니다." },
                    { speaker: "protagonist", expression: "default", text: "손님이 들어왔다. 첫 번째 업무를 시작할 차례다." }
                ],
                choices: [
                    { text: "따뜻한 차를 내어주며 이야기를 들어준다.", nextScene: "ending_healer" },
                    { text: "조용히 자리를 권하며 침묵을 지킨다.", nextScene: "ending_listener" }
                ]
            }
        };

        // 5. 엔딩 정의 (엔딩 갤러리 연동 및 조건)
        const ENDINGS = {
            "ending_coward": {
                id: "ending_coward",
                title: "엔딩 1: 일상으로의 도주",
                description: "신과의 만남을 뒤로하고 평범한 일상으로 돌아갔다."
            },
            "ending_healer": {
                id: "ending_healer",
                title: "엔딩 2: 마음을 치유하는 바리스타",
                description: "손님의 상픔을 공감하고 따뜻하게 보듬어준 첫 번째 기록."
            },
            "ending_listener": {
                id: "ending_listener",
                title: "엔딩 3: 침묵 속의 위로",
                description: "말없이 곁을 지켜주는 것만으로도 깊은 위안을 주었다."
            }
        };

        /* ==========================================================================
           [게임 시스템 코어 엔진 영역]
           아래 코드는 UI와 데이터 흐름을 처리하는 엔진입니다.
           ========================================================================== */

        // 게임 상태 변수
        let currentUser = null;
        let currentGameState = {
            currentSceneId: "scene_01",
            currentEpisodeId: "prologue",
            dialogueIndex: 0,
            unlockedEndings: [],
            history: [] // 대화 로그용
        };

        let gameSettings = {
            textSpeed: 30,
            bgmVolume: 50,
            sfxVolume: 50,
            autoPlay: false
        };

        let autoPlayTimer = null;
        let isTyping = false;

        // 로그인 처리
        function handleLogin() {
            const input = document.getElementById("username-input").value.trim();
            if (!input) {
                showToast("플레이어 이름을 입력해주세요.");
                return;
            }
            currentUser = input;
            document.getElementById("current-user-badge").innerText = `계정: ${currentUser}`;
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("title-screen").classList.remove("hidden");
            loadUserSettings();
            loadProgressFromStorage();
        }

        // 게임 시작 (처음부터)
        function startGame() {
            currentGameState = {
                currentSceneId: EPISODES["prologue"].startScene,
                currentEpisodeId: "prologue",
                dialogueIndex: 0,
                unlockedEndings: currentGameState.unlockedEndings || [],
                history: []
            };
            enterScene(currentGameState.currentSceneId);
        }

        // 장면 진입
        function enterScene(sceneId) {
            const scene = SCENES[sceneId];
            if (!scene) {
                showToast("존재하지 않는 장면 ID입니다: " + sceneId);
                return;
            }

            // 엔딩 체크인지 확인
            if (ENDINGS[sceneId]) {
                triggerEnding(sceneId);
                return;
            }

            currentGameState.currentSceneId = sceneId;
            currentGameState.currentEpisodeId = scene.episode || "prologue";
            currentGameState.dialogueIndex = 0;

            // 화면 전환
            document.getElementById("title-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("choices-container").classList.add("hidden");

            // 배경 설정
            const bgUrl = BACKGROUNDS[scene.background] || BACKGROUNDS["cafe_interior"];
            document.getElementById("game-screen").style.backgroundImage = `url('${bgUrl}')`;

            // 에피소드 및 씬 이름 업데이트
            const epInfo = EPISODES[currentGameState.currentEpisodeId];
            document.getElementById("ui-episode-name").innerText = epInfo ? epInfo.name : "스토리";
            document.getElementById("ui-scene-id").innerText = sceneId;

            renderCurrentDialogue();
            autoSaveGame();
        }

        // 현재 대사 렌더링
        function renderCurrentDialogue() {
            const scene = SCENES[currentGameState.currentSceneId];
            if (!scene) return;

            const dialogues = scene.dialogues;
            const idx = currentGameState.dialogueIndex;

            if (idx >= dialogues.length) {
                // 대사가 끝났을 때 처리
                if (scene.choices && scene.choices.length > 0) {
                    showChoices(scene.choices);
                } else if (scene.nextScene) {
                    enterScene(scene.nextScene);
                } else {
                    showToast("스토리의 끝입니다.");
                }
                return;
            }

            const currentDlg = dialogues[idx];
            
            // 화자 이름 매핑
            const charInfo = CHARACTERS[currentDlg.speaker];
            const speakerName = charInfo ? charInfo.name : currentDlg.speaker;
            document.getElementById("speaker-name").innerText = speakerName;

            // 캐릭터 이미지 렌더링
            renderCharacters(currentDlg.speaker, currentDlg.expression);

            // 대사 출력 및 로그 추가
            document.getElementById("dialogue-text").innerText = currentDlg.text;
            currentGameState.history.push({
                speaker: speakerName,
                text: currentDlg.text
            });
        }

        // 캐릭터 이미지 표시
        function renderCharacters(activeSpeakerKey, expressionKey) {
            const container = document.getElementById("character-container");
            container.innerHTML = "";

            // 현재 장면에 등장하는 캐릭터 표시 (심플하게 화자 강조 및 반대편 배치 지원)
            for (let key in CHARACTERS) {
                if (key === activeSpeakerKey) {
                    const charData = CHARACTERS[key];
                    const imgUrl = charData.expressions[expressionKey] || charData.expressions["default"];
                    
                    const wrapper = document.createElement("div");
                    wrapper.className = "flex flex-col items-center transition-all duration-300 transform scale-105 filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]";
                    wrapper.innerHTML = `
                        <img src="${imgUrl}" alt="${charData.name}" class="h-96 object-contain rounded-lg border-b-4 border-indigo-500" onerror="this.src='https://placehold.co/300x600/333/fff?text=No+Image'">
                    `;
                    container.appendChild(wrapper);
                }
            }
        }

        // 다음 대사 클릭
        function handleNextClick() {
            const scene = SCENES[currentGameState.currentSceneId];
            if (!scene) return;

            if (currentGameState.dialogueIndex < scene.dialogues.length - 1) {
                currentGameState.dialogueIndex++;
                renderCurrentDialogue();
            } else {
                if (scene.choices && scene.choices.length > 0) {
                    // 선택지가 있으면 선택지창 표시
                    showChoices(scene.choices);
                } else if (scene.nextScene) {
                    enterScene(scene.nextScene);
                }
            }
        }

        // 선택지 표시
        function showChoices(choices) {
            const container = document.getElementById("choices-container");
            container.innerHTML = `
                <h3 class="text-xl font-bold mb-4 text-indigo-300">원하는 행동을 선택하세요</h3>
                <div class="flex flex-col gap-3 w-full max-w-md" id="choices-list"></div>
            `;
            const list = document.getElementById("choices-list");

            choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "py-4 px-6 bg-gray-800 hover:bg-indigo-600 border border-gray-600 rounded-xl text-left font-bold transition shadow-lg text-white text-lg";
                btn.innerText = choice.text;
                btn.onclick = () => {
                    container.classList.add("hidden");
                    enterScene(choice.nextScene);
                };
                list.appendChild(btn);
            });

            container.classList.remove("hidden");
        }

        // 엔딩 트리거
        function triggerEnding(endingId) {
            const ending = ENDINGS[endingId];
            if (!ending) return;

            if (!currentGameState.unlockedEndings.includes(endingId)) {
                currentGameState.unlockedEndings.push(endingId);
            }

            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("title-screen").classList.remove("hidden");
            showToast(`[엔딩 도달] ${ending.title}`);
            autoSaveGame();
        }

        // 자동 진행 토글
        function toggleAutoPlay() {
            gameSettings.autoPlay = !gameSettings.autoPlay;
            const btn = document.getElementById("auto-btn");
            if (gameSettings.autoPlay) {
                btn.innerText = "자동: 켜짐";
                btn.classList.add("bg-indigo-600");
                startAutoPlayLoop();
            } else {
                btn.innerText = "자동: 꺼짐";
                btn.classList.remove("bg-indigo-600");
                clearInterval(autoPlayTimer);
            }
        }

        function startAutoPlayLoop() {
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(() => {
                if (gameSettings.autoPlay) {
                    const scene = SCENES[currentGameState.currentSceneId];
                    if (scene && currentGameState.dialogueIndex < scene.dialogues.length - 1) {
                        handleNextClick();
                    }
                }
            }, 3000);
        }

        // 세이브 / 로드 시스템 (로컬 스토리지 기반 및 계정 분리 구조)
        function getStorageKey() {
            return `visual_novel_save_${currentUser || 'default'}`;
        }

        function autoSaveGame() {
            if (!currentUser) return;
            const saveData = {
                state: currentGameState,
                timestamp: new Date().toLocaleString()
            };
            localStorage.setItem(getStorageKey() + "_auto", JSON.stringify(saveData));
        }

        function manualSave(slotIndex) {
            if (!currentUser) return;
            const saveData = {
                state: currentGameState,
                timestamp: new Date().toLocaleString()
            };
            localStorage.setItem(getStorageKey() + `_slot_${slotIndex}`, JSON.stringify(saveData));
            showToast(`슬롯 ${slotIndex}에 저장되었습니다.`);
            openSaveModal(); // 모달 갱신
        }

        function loadGameSlot(slotKey) {
            const saved = localStorage.getItem(slotKey);
            if (!saved) {
                showToast("저장된 데이터가 없습니다.");
                return;
            }
            const data = JSON.parse(saved);
            currentGameState = data.state;
            document.getElementById("modal-overlay").classList.add("hidden");
            enterScene(currentGameState.currentSceneId);
            showToast("게임을 불러왔습니다.");
        }

        function loadProgressFromStorage() {
            if (!currentUser) return;
            const autoSaved = localStorage.getItem(getStorageKey() + "_auto");
            if (autoSaved) {
                try {
                    const data = JSON.parse(autoSaved);
                    if (data && data.state) {
                        currentGameState.unlockedEndings = data.state.unlockedEndings || [];
                    }
                } catch(e) {}
            }
        }

        // 모달창 오픈 함수들 (저장, 불러오기, 로그, 설정, 엔딩 갤러리)
        function openSaveModal() {
            const modal = document.getElementById("modal-overlay");
            const content = document.getElementById("modal-content");
            
            let slotsHtml = "";
            for (let i = 1; i <= 3; i++) {
                const slotKey = getStorageKey() + `_slot_${i}`;
                const data = localStorage.getItem(slotKey);
                let info = "빈 슬롯";
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        info = `저장 시간: ${parsed.timestamp} (장면: ${parsed.state.currentSceneId})`;
                    } catch(e) {}
                }
                slotsHtml += `
                    <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div>
                            <span class="font-bold text-indigo-400">슬롯 ${i}</span>
                            <p class="text-xs text-gray-400">${info}</p>
                        </div>
                        <button onclick="manualSave(${i})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-bold rounded-lg transition">저장하기</button>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white">게임 저장</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">✕ 닫기</button>
                </div>
                <div class="flex flex-col gap-3 overflow-y-auto flex-1 pr-1">${slotsHtml}</div>
            `;
            modal.classList.remove("hidden");
        }

        function openLoadModal() {
            const modal = document.getElementById("modal-overlay");
            const content = document.getElementById("modal-content");
            
            let slotsHtml = "";
            // 오토세이브 슬롯 포함
            const autoKey = getStorageKey() + "_auto";
            const autoData = localStorage.getItem(autoKey);
            let autoInfo = "기록 없음";
            if (autoData) {
                try {
                    const parsed = JSON.parse(autoData);
                    autoInfo = `자동저장: ${parsed.timestamp} (${parsed.state.currentSceneId})`;
                } catch(e) {}
            }
            slotsHtml += `
                <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <div>
                        <span class="font-bold text-green-400">자동 저장 파일</span>
                        <p class="text-xs text-gray-400">${autoInfo}</p>
                    </div>
                    <button onclick="loadGameSlot('${autoKey}')" class="px-4 py-2 bg-green-600 hover:bg-green-500 text-sm font-bold rounded-lg transition" ${!autoData?'disabled':''}>불러오기</button>
                </div>
            `;

            for (let i = 1; i <= 3; i++) {
                const slotKey = getStorageKey() + `_slot_${i}`;
                const data = localStorage.getItem(slotKey);
                let info = "빈 슬롯";
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        info = `저장 시간: ${parsed.timestamp} (장면: ${parsed.state.currentSceneId})`;
                    } catch(e) {}
                }
                slotsHtml += `
                    <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div>
                            <span class="font-bold text-indigo-400">슬롯 ${i}</span>
                            <p class="text-xs text-gray-400">${info}</p>
                        </div>
                        <button onclick="loadGameSlot('${slotKey}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-bold rounded-lg transition" ${!data?'disabled':''}>불러오기</button>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white">게임 불러오기</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">✕ 닫기</button>
                </div>
                <div class="flex flex-col gap-3 overflow-y-auto flex-1 pr-1">${slotsHtml}</div>
            `;
            modal.classList.remove("hidden");
        }

        function openLogModal() {
            const modal = document.getElementById("modal-overlay");
            const content = document.getElementById("modal-content");

            let logsHtml = currentGameState.history.map(item => `
                <div class="border-b border-gray-800 pb-3">
                    <span class="text-xs font-bold text-indigo-400">${item.speaker}</span>
                    <p class="text-sm text-gray-200 mt-1">${item.text}</p>
                </div>
            `).join("");

            if (!logsHtml) logsHtml = "<p class='text-gray-500 text-center py-8'>대화 기록이 없습니다.</p>";

            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white">대화 로그</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">✕ 닫기</button>
                </div>
                <div class="flex flex-col gap-4 overflow-y-auto flex-1 pr-2 bg-gray-950 p-4 rounded-xl">${logsHtml}</div>
            `;
            modal.classList.remove("hidden");
        }

        function openSettingsModal() {
            const modal = document.getElementById("modal-overlay");
            const content = document.getElementById("modal-content");

            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white">설정</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">✕ 닫기</button>
                </div>
                <div class="flex flex-col gap-6 py-4">
                    <div>
                        <label class="text-sm text-gray-300 block mb-2">대사 출력 속도</label>
                        <input type="range" min="10" max="100" value="${gameSettings.textSpeed}" onchange="gameSettings.textSpeed=this.value" class="w-full accent-indigo-600">
                    </div>
                    <div>
                        <label class="text-sm text-gray-300 block mb-2">배경음악 (BGM)</label>
                        <input type="range" min="0" max="100" value="${gameSettings.bgmVolume}" onchange="gameSettings.bgmVolume=this.value" class="w-full accent-indigo-600">
                    </div>
                    <div>
                        <label class="text-sm text-gray-300 block mb-2">효과음 (SFX)</label>
                        <input type="range" min="0" max="100" value="${gameSettings.sfxVolume}" onchange="gameSettings.sfxVolume=this.value" class="w-full accent-indigo-600">
                    </div>
                </div>
            `;
            modal.classList.remove("hidden");
        }

        function openEndingGallery() {
            const modal = document.getElementById("modal-overlay");
            const content = document.getElementById("modal-content");

            let galleryHtml = "";
            for (let key in ENDINGS) {
                const ending = ENDINGS[key];
                const isUnlocked = currentGameState.unlockedEndings.includes(key);
                galleryHtml += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col justify-between">
                        <div>
                            <span class="text-xs ${isUnlocked ? 'text-green-400' : 'text-gray-500'} font-bold">${isUnlocked ? '✓ 해금 완료' : '🔒 잠김'}</span>
                            <h3 class="font-bold text-lg text-white mt-1">${isUnlocked ? ending.title : '??? (미해금 엔딩)'}</h3>
                            <p class="text-xs text-gray-400 mt-2">${isUnlocked ? ending.description : '조건을 달성하여 엔딩을 확인하세요.'}</p>
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white">엔딩 갤러리</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">✕ 닫기</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 overflow-y-auto flex-1 pr-1">${galleryHtml}</div>
            `;
            modal.classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("modal-overlay").classList.add("hidden");
        }

        function loadUserSettings() {
            // 사용자 설정 로드 로직 (필요시 구현)
        }

        function returnToTitle() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("title-screen").classList.remove("hidden");
        }

        // 알림 토스트 메시지
        function showToast(msg) {
            const toast = document.getElementById("message-box");
            toast.innerText = msg;
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2500);
        }
    </script>
</body>
</html>
